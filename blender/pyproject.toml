[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena_assets_blender"
version = "0.1.0"
description = "Blender model conversion worker for arena_assets"
authors = [
    { name = "kuro", email = "giang.nht108201@gmail.com" },
    { name = "Vova Shcherbyna", email = "dev@voshch.dev" },
]
requires-python = "==3.11.*"
dependencies = [
    "bpy~=4.5.3",
    "mathutils~=3.3.0",
    "numpy~=1.26.4",
    "pillow~=12.2",
    "scipy~=1.15.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
arena-assets-blender = "arena_assets_blender.__main__:main"

[project.urls]
Homepage = "https://github.com/voshch/arena-assets"
Repository = "https://github.com/voshch/arena-assets"

[tool.setuptools.packages.find]
where = ["."]
include = ["arena_assets_blender*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
