[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena_assets"
version = "0.1.0"
description = "TODO"
authors = [
    { name = "kuro", email = "giang.nht108201@gmail.com" },
    { name = "Vova Shcherbyna", email = "dev@voshch.dev" },
]
dependencies = [
    "chromadb~=1.0.21",
    "pyyaml~=6.0.2",
    "attrs~=25.3.0",
    "cattrs~=25.2.0",
    "typer~=0.19.1",
    "enlighten~=1.14.1",
    "usd-core>=26.3",
]


[project.optional-dependencies]
test = [
    "pytest~=8.0",
]
vlm = [
    "google-genai~=2.32",
]

[project.urls]
Homepage = "https://github.com/voshch/arena-assets"
Repository = "https://github.com/voshch/arena-assets"


[tool.setuptools.packages.find]
where = ["."]
include = ["arena_assets*"]

[tool.setuptools.package-data]
arena_assets = ["semantic/asa.yaml", "semantic/seats_example.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 320
src = ["arena_assets"]
extend-exclude = [
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "PYI"]
ignore = ["E501", "E402", "F841", "E731", "PYI051", "E741", "UP035"]

[tool.ruff.lint.per-file-ignores]
"arena_assets/cli/**/*.py" = ["B008"]
"arena_assets/__main__.py" = ["B008"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
mypy-init-return = true
allow-star-arg-any = true

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

